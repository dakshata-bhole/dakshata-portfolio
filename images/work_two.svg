<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#121216"/>
  
  <!-- Mountain peak vector lines -->
  <polygon points="150,450 380,180 500,320 620,200 800,450" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>
  <polygon points="250,450 480,220 580,350 700,280 800,450" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linejoin="round" opacity="0.3"/>
  
  <!-- Camera Focus Marks -->
  <path d="M 50 100 L 50 50 L 100 50" fill="none" stroke="#34d399" stroke-width="2"/>
  <path d="M 750 100 L 750 50 L 700 50" fill="none" stroke="#34d399" stroke-width="2"/>
  <path d="M 50 350 L 50 400 L 100 400" fill="none" stroke="#34d399" stroke-width="2"/>
  <path d="M 750 350 L 750 400 L 700 400" fill="none" stroke="#34d399" stroke-width="2"/>
  <circle cx="400" cy="225" r="40" fill="none" stroke="#34d399" stroke-dasharray="8 6" stroke-width="1.5"/>
  
  <!-- Overlay info -->
  <text x="70" y="80" fill="#34d399" font-family="monospace" font-size="12">REC</text>
  <circle cx="105" cy="76" r="5" fill="#e11d48"/>
  <text x="680" y="80" fill="#34d399" font-family="monospace" font-size="12">LUT ON</text>
</svg>
