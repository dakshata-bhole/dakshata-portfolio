<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#121216"/>
  
  <!-- Gaming HUD aesthetics -->
  <!-- Crosshair -->
  <circle cx="400" cy="225" r="10" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <line x1="400" y1="205" x2="400" y2="215" stroke="#34d399" stroke-width="1.5"/>
  <line x1="400" y1="235" x2="400" y2="245" stroke="#34d399" stroke-width="1.5"/>
  <line x1="380" y1="225" x2="390" y2="225" stroke="#34d399" stroke-width="1.5"/>
  <line x1="410" y1="225" x2="420" y2="225" stroke="#34d399" stroke-width="1.5"/>
  
  <!-- Grid overlay -->
  <line x1="50" y1="225" x2="750" y2="225" stroke="#34d399" stroke-width="0.5" opacity="0.2"/>
  <line x1="400" y1="50" x2="400" y2="400" stroke="#34d399" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Cyber overlay details -->
  <polygon points="50,50 120,50 140,70 50,70" fill="rgba(52, 211, 153, 0.1)" stroke="#34d399" stroke-width="1"/>
  <text x="60" y="64" fill="#34d399" font-family="monospace" font-size="11">FPS 144</text>
  
  <polygon points="750,50 680,50 660,70 750,70" fill="rgba(52, 211, 153, 0.1)" stroke="#34d399" stroke-width="1"/>
  <text x="675" y="64" fill="#34d399" font-family="monospace" font-size="11">PING 12MS</text>
  
  <!-- Vector lines for motion tracking -->
  <path d="M 100 350 Q 250 200 400 225 T 700 100" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>
  <circle cx="700" cy="100" r="4" fill="#34d399"/>
</svg>
