<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#121216"/>
  
  <!-- Tokyo neon tower abstract -->
  <line x1="400" y1="100" x2="400" y2="300" stroke="#34d399" stroke-width="2" opacity="0.3"/>
  <polygon points="400,120 370,250 430,250" fill="none" stroke="#34d399" stroke-width="2"/>
  <circle cx="400" cy="120" r="8" fill="#34d399"/>
  
  <!-- Neon street grid perspective lines -->
  <line x1="200" y1="450" x2="350" y2="250" stroke="#34d399" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="450" x2="450" y2="250" stroke="#34d399" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="450" x2="400" y2="250" stroke="#34d399" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Editing elements -->
  <rect x="30" y="30" width="150" height="30" rx="5" fill="rgba(52, 211, 153, 0.1)" stroke="#34d399" stroke-width="1"/>
  <text x="45" y="50" fill="#34d399" font-family="monospace" font-size="12">CAM A | 4K 24FPS</text>
  
  <rect x="620" y="30" width="150" height="30" rx="5" fill="rgba(52, 211, 153, 0.1)" stroke="#34d399" stroke-width="1"/>
  <text x="635" y="50" fill="#34d399" font-family="monospace" font-size="12">TC 01 14 02 18</text>
  
  <!-- Audio Waveform at bottom -->
  <path d="M 50 400 L 100 410 L 150 390 L 200 420 L 250 380 L 300 410 L 350 400 L 400 430 L 450 370 L 500 410 L 550 395 L 600 415 L 650 385 L 700 410 L 750 400" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
