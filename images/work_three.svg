<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#121216"/>
  
  <!-- Multi track audio editing layout -->
  <!-- Track 1 -->
  <rect x="50" y="80" width="700" height="60" rx="3" fill="#1d1d24"/>
  <path d="M 60 110 L 100 90 L 140 130 L 180 100 L 220 120 L 260 95 L 300 115 L 340 100 L 380 125 L 420 95 L 460 110 L 500 100 L 540 120 L 580 90 L 620 130 L 660 100 L 700 115 L 740 110" fill="none" stroke="#34d399" stroke-width="2"/>
  
  <!-- Track 2 -->
  <rect x="50" y="160" width="700" height="60" rx="3" fill="#1d1d24"/>
  <path d="M 60 190 L 90 205 L 120 175 L 150 195 L 180 185 L 210 200 L 240 190 L 270 180 L 300 205 L 330 185 L 360 195 L 390 190 L 420 180 L 450 200 L 480 190 L 510 185 L 540 195 L 570 190 L 600 180 L 630 200 L 660 190 L 690 185 L 720 195 L 740 190" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Track 3 -->
  <rect x="50" y="240" width="700" height="60" rx="3" fill="#1d1d24"/>
  <path d="M 80 270 L 120 280 L 160 260 L 200 275 L 240 265 L 280 270 L 320 260 L 360 280 L 400 270 L 440 265 L 480 275 L 520 260 L 560 270 L 600 265 L 640 280 L 680 260 L 720 270" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Playhead line -->
  <line x1="320" y1="50" x2="320" y2="330" stroke="#34d399" stroke-width="2"/>
  <polygon points="310,50 330,50 320,65" fill="#34d399"/>
  
  <!-- Interface metrics -->
  <text x="50" y="370" fill="#34d399" font-family="monospace" font-size="12">AUDIO MONO 01</text>
  <text x="650" y="370" fill="#34d399" font-family="monospace" font-size="12">LOUDNESS LUFS</text>
</svg>
